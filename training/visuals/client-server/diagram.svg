<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title description">
  <title id="title">What happened when you pressed the button</title>
  <desc id="description">You pressed a button in Preview. The page asks the running practice app for a greeting. The app prepares it, replies, and the page displays the greeting.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="360" height="560" rx="16" fill="#f5f8fc"/>
  <g id="client"><rect x="24" y="30" width="312" height="118" rx="16" fill="#dcecff" stroke="#2563a0" stroke-width="3"/><text x="180" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#172a3a">Your page in Preview</text><text x="180" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#172a3a">You press the button</text><text x="180" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#172a3a">You read the greeting</text></g>
  <path d="M102 166V338" fill="none" stroke="#2563a0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M258 338V166" fill="none" stroke="#16705b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="18" y="214" font-family="system-ui,sans-serif" font-size="17" fill="#172a3a">Ask ↓</text>
  <text x="230" y="292" font-family="system-ui,sans-serif" font-size="17" fill="#172a3a">Greeting ↑</text>
  <text id="request-label" x="180" y="249" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#172a3a">Page asks for a greeting</text>
  <text id="response-label" x="180" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#172a3a">Greeting returns</text>
  <g id="server"><rect x="24" y="370" width="312" height="144" rx="16" fill="#dcf3eb" stroke="#16705b" stroke-width="3"/><text x="180" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#172a3a">Running practice app</text><text id="work-label" x="180" y="441" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#172a3a">Prepares a greeting</text><g id="port"><rect x="66" y="462" width="228" height="33" rx="8" fill="#fff" stroke="#16705b"/><text id="port-label" x="180" y="484" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#172a3a">Running app</text></g></g>
  <circle id="packet" cx="102" cy="166" r="8" fill="#d47b05" stroke="#172a3a" stroke-width="2" opacity="0"/>
  <text x="180" y="541" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#172a3a">Explanation — try the real app in Preview</text>
</svg>
