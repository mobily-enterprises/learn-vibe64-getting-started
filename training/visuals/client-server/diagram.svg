<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" aria-labelledby="title description">
  <title id="title">What happened when you pressed the button</title>
  <desc id="description">You pressed a button in Preview. The page asks the running practice app for a greeting. The app prepares it, replies, and the page displays the greeting.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="480" height="344" rx="16" fill="#f5f8fc"/>
  <g id="client">
    <rect x="24" y="10" width="432" height="85" rx="16" fill="#dcecff" stroke="#2563a0" stroke-width="3"/>
    <text x="240" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#172a3a">Your page in Preview</text>
    <text x="240" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">You press the button</text>
    <text x="240" y="87" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">You read the greeting</text>
  </g>
  <path d="M40 104V276" fill="none" stroke="#2563a0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M440 276V104" fill="none" stroke="#16705b" stroke-width="4" marker-end="url(#arrow)"/>
  <g id="server">
    <rect x="24" y="286" width="432" height="52" rx="12" fill="#dcf3eb" stroke="#16705b" stroke-width="3"/>
    <g id="port"><text id="port-label" x="240" y="309" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#172a3a">Running app</text></g>
    <text id="work-label" x="240" y="331" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">Prepares a greeting</text>
  </g>
  <text x="70" y="198" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">Ask ↓</text>
  <text x="305" y="198" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">Greeting ↑</text>
  <circle id="packet" cx="40" cy="104" r="8" fill="#d47b05" stroke="#172a3a" stroke-width="2" opacity="0"/>
  <rect x="56" y="130" width="368" height="30" rx="8" fill="#f5f8fc"/>
  <text id="request-label" x="240" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">Page asks for a greeting</text>
  <rect x="56" y="228" width="368" height="30" rx="8" fill="#f5f8fc"/>
  <text id="response-label" x="240" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#172a3a">Greeting returns</text>
</svg>
